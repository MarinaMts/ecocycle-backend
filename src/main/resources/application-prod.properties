# ================================
# EcoCycle Backend - application-prod.properties
# Profile "prod": banco definitivo (PostgreSQL / Neon), schema versionado via Flyway.
# Ativar com: -Dspring.profiles.active=prod  (ou variavel SPRING_PROFILES_ACTIVE=prod)
# ================================

# ---- Servidor ----
# O Render define a porta via variavel de ambiente PORT em tempo de execucao.
# Localmente (sem essa variavel), cai no fallback 8080.
server.port=${PORT:8080}

# ---- Banco PostgreSQL (Neon) ----
# NUNCA commitar a connection string real com senha. Defina via variaveis de ambiente:
#   DB_URL      = jdbc:postgresql://ep-xxxx-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require
#   DB_USERNAME = neondb_owner
#   DB_PASSWORD = (a senha mostrada no dashboard do Neon em "Show password")
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# validate (nao update/create): quem cria e altera o schema agora e o Flyway, nao o Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Precisa ser false em producao: essa flag (herdada do application.properties,
# pensada para o H2 em dev) conflita com o Flyway e causa o erro
# "Circular depends-on relationship between 'flyway' and 'entityManagerFactory'".
spring.jpa.defer-datasource-initialization=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- H2 console (desligado em producao) ----
spring.h2.console.enabled=false

# ---- Logging (mais enxuto em producao) ----
logging.level.root=WARN
logging.level.com.ecocycle.backend=INFO
logging.level.org.springframework.security=WARN
