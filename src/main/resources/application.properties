# ================================
# EcoCycle Backend - application.properties
# ================================

spring.application.name=ecocycle-backend
server.port=8080

# ---- Banco H2 em memoria (fase de desenvolvimento) ----
# Troca futura para banco definitivo (ex.: PostgreSQL) apenas via configuracao,
# sem alterar codigo (ver documento de decisoes tecnicas, secao 7.1).
spring.datasource.url=jdbc:h2:mem:ecocycledb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (apenas para depuracao em desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
# ddl-auto nesta fase; migracao para Flyway quando o modelo de dados estabilizar (pendencia 8)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# ---- Flyway ----
# Desligado neste profile: dev/test continuam usando H2 com ddl-auto (acima).
# O banco definitivo (Postgres) e versionado via Flyway apenas no profile "prod"
# (ver application-prod.properties e src/main/resources/db/migration).
spring.flyway.enabled=false

# ---- JWT ----
# IMPORTANTE: em producao, definir via variavel de ambiente JWT_SECRET (ver README).
# O valor abaixo e apenas um fallback para rodar localmente em desenvolvimento.
jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-secreta-de-pelo-menos-256-bits-em-producao}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---- CORS ----
# So afeta clientes baseados em navegador (Flutter Web, um futuro painel admin,
# Swagger UI) - o app Flutter nativo (Android) NAO passa por CORS. Em producao,
# definir via variavel de ambiente CORS_ALLOWED_ORIGINS (lista separada por virgula).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ---- Logging (SLF4J - niveis conforme secao 7.3 do documento) ----
logging.level.root=INFO
logging.level.com.ecocycle.backend=INFO
logging.level.org.springframework.security=WARN

# ---- Actuator ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Scanner (reconhecimento on-device via TFLite) ----
# Limiar minimo de confianca (%) para considerar um scan reconhecido.
# Ajustavel sem novo deploy via variavel de ambiente SCANNER_LIMIAR_CONFIANCA.
scanner.limiar-confianca=${SCANNER_LIMIAR_CONFIANCA:60}
