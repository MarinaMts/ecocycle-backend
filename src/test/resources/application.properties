# ================================
# EcoCycle Backend - application.properties (perfil de TESTES)
# ================================
# Sobrepoe o application.properties principal quando os testes rodam
# (Spring Boot Test le automaticamente src/test/resources antes de src/main/resources).

spring.datasource.url=jdbc:h2:mem:ecocycledb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Flyway agora esta no classpath (adicionado para o profile de producao/Postgres).
# Precisa ficar desligado aqui, senao entra em conflito circular com o
# entityManagerFactory - o mesmo problema que ocorria ao rodar com o profile "prod"
# antes de definirmos defer-datasource-initialization=false la.
spring.flyway.enabled=false

jwt.secret=chave-secreta-apenas-para-testes-automatizados-nao-usar-em-producao
jwt.expiration-ms=604800000

# Rate limiting do login desabilitado nos testes - o filtro e um singleton cuja
# contagem persiste durante toda a suite de testes (mesmo ApplicationContext
# reaproveitado entre classes), entao sem isso os testes de /login em sequencia
# acabariam esbarrando artificialmente no limite de 10 tentativas/minuto.
app.rate-limit.login.enabled=false

logging.level.root=WARN
logging.level.com.ecocycle.backend=INFO
